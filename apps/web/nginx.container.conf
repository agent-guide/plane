# plane-web 容器内 nginx：静态 SPA + 同源反代（api/minio 走 agw-net 容器名）。
# 端口/签名坑对齐测试服 v2 配置（deploy-v2.sh / v2-stack runbook §nginx）：
#   /uploads 反代 minio（封面上传/预签名）；Host 头必须带端口（S3 签名一致性）；
#   ^~ 无斜杠前缀匹配 boto 生成的无斜杠预签名 URL。
server {
    listen 80;
    client_max_body_size 25m;

    # 附件/上传：反代 minio（容器网直连）
    location ^~ /plane-uploads {
        proxy_pass http://minio:9000;
        proxy_set_header Host $http_host;      # 带端口——预签名 URL 校验依赖
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API 同源反代（Django runserver，SSE 流式——禁缓冲保流式）
    location ~ ^/(api|auth)/ {
        proxy_pass http://plane-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;                   # SSE/流式响应不缓冲
        proxy_read_timeout 3600s;              # 长任务轮询/流式窗口
    }

    # god-mode（实例管理端 SPA，子路径部署——首启初始化入口）
    location /god-mode/ {
        alias /usr/share/nginx/html/god-mode/;
        try_files $uri $uri/ /god-mode/index.html;
    }

    # SPA 静态资源
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
